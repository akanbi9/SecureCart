
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SecureCart</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        nav {
            background: #102a43;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .login-card {
            background: white;
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 { text-align: center; }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #087f8c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #066874; }

        #message {
            margin-top: 18px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">🛒 SecureCart</div>
    <div>
        <a href="/">Home</a>
        <a href="/products">Products</a>
    </div>
</nav>

<div class="login-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your SecureCart account</p>

    <form id="loginForm">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="register-link">
        Don't have an account?
        <a href="/register">Register here</a>
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    button.disabled = true;
    message.textContent = "Signing in...";
    message.style.color = "#172b4d";

    try {
        const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const result = await response.json();

        if (response.ok) {
            message.textContent = "Login successful!";
            message.style.color = "green";

            // Return to the homepage until the
            // authenticated dashboard is implemented.
            window.location.assign("/products");
        } else {
            message.textContent = result.error || "Login failed.";
            message.style.color = "red";
        }
    } catch (error) {
        message.textContent = "Unable to connect. Please try again.";
        message.style.color = "red";
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
