
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCart | Home</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        nav {
            background: #102a43;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        .hero {
            padding: 100px 8%;
            text-align: center;
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #52677b;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            background: #087f8c;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #52677b;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🛒 SecureCart</div>
        <div class="links">
            <a href="/">Home</a>
            <a href="/products">Products</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to SecureCart</h1>
        <p>Shop smarter with a security-focused e-commerce experience.</p>
        <p>Built with Python, Flask and secure coding principles.</p>
        <a href="/products" class="button">Explore Products</a>
    </section>

    <footer>
        SecureCart | Cybersecurity Capstone Project
    </footer>

</body>
</html>
