
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SecureCart</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        nav {
            background: #102a43;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .register-card {
            background: white;
            max-width: 440px;
            margin: 70px auto;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 { text-align: center; }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #087f8c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #066874; }
        button:disabled { opacity: 0.6; cursor: wait; }

        #message {
            text-align: center;
            margin-top: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🛒 SecureCart</div>
    <div>
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/login">Login</a>
    </div>
</nav>

<div class="register-card">
    <h1>Create Account</h1>

    <p class="subtitle">
        Join SecureCart and start shopping.
    </p>

    <form id="registerForm">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit" id="registerButton">
            Create Account
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="login-link">
        Already have an account?
        <a href="/login">Login here</a>
    </p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "red";
        return;
    }

    button.disabled = true;
    message.textContent = "Creating account...";
    message.style.color = "#172b4d";

    try {
        const response = await fetch("/api/v1/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const result = await response.json();

        if (response.ok) {
            message.textContent = "Registration successful! Redirecting to login...";
            message.style.color = "green";

            document.getElementById("registerForm").reset();

            window.location.assign("/login");
        } else {
            message.textContent = result.error || "Registration failed.";
            message.style.color = "red";
        }
    } catch (error) {
        message.textContent = "Unable to connect. Please try again.";
        message.style.color = "red";
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
