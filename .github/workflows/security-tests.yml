
name: SecureCart Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security tests
        env:
          SECRET_KEY: securecart-ci-test-secret-not-for-production
          PAYMENT_WEBHOOK_SECRET: securecart-ci-webhook-test-secret
        run: |
          python -m pytest tests/security/ -q
